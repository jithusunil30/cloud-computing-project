services:
  - type: web
    name: ecofinops-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GCP_PROJECT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /mcp/health
